name: trainsmurf
description: TrainSmurf - Train Search and Reminder App (College Project)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SQLite local database
  sqflite: ^2.3.3

  # Required for SQLite on Windows/Linux/macOS desktop
  sqflite_common_ffi: ^2.3.4

  # Helper to get the correct DB file path on device
  path: ^1.9.0

  # Local push notifications for reminders
  flutter_local_notifications: ^17.2.2

  # Date & time formatting
  intl: ^0.19.0

  # Local session state (logged-in user)
  shared_preferences: ^2.3.2

  # Default Flutter icon set
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/train_data.db
